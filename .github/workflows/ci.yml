name: CI

on:
  push:
    branches: [main, v2]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: CLI smoke test
        run: |
          node dist/cli.js person -n 3 --seed 1 --csv
          node dist/cli.js infer test/fixtures/shop.prisma --explain > /dev/null
      - name: Pack dry run
        if: matrix.node == 22
        run: npm pack --dry-run
